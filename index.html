<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shortcuts</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header class="top-bar">
    <div class="top-bar__left-group">
      <div id="dateDisplay" class="top-bar__date"></div>
      <div id="clock" class="top-bar__clock"></div>
    </div>

    <section class="search-section">
      <div class="search-bar">
        <span class="search-bar__icon-left" aria-hidden="true">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/5/55/Magnifying_glass_icon.svg"
            alt=""
          />
        </span>
        <input
          id="searchBar"
          type="text"
          class="search-bar__input"
          placeholder="Search Google..."
          aria-label="Search Google"
        />
        <button id="searchButton" class="search-bar__button" aria-label="Search">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/5/55/Magnifying_glass_icon.svg"
            alt=""
          />
        </button>
      </div>
    </section>

    <div id="tempDisplay" class="top-bar__item top-bar__temp" aria-live="polite">
      <div class="temp-value">--°F</div>
      <div class="temp-location">Local Temp</div>
    </div>
  </header>

  <nav id="categoryNav" class="category-nav"></nav>

<div class="sort-controls">
  <span class="sort-header">SORT ICONS BY:</span>

  <label class="sort-label">
    <input type="radio" name="sortMode" value="alpha" checked
           onchange="handleSortChange('alpha')">
    Name
  </label>

  <label class="sort-label">
    <input type="radio" name="sortMode" value="freq"
           onchange="handleSortChange('freq')">
    Frequency
  </label>
</div>


  <main>
    <section class="shortcuts-section">
      <div id="shortcutContainer" class="shortcut-grid"></div>
    </section>
  </main>

  <footer class="bottom-bar" id="bottomBar">
    <!-- Action buttons injected dynamically when user is selected -->
  </footer>

  <!-- User Profile Selector Bar -->
  <div class="user-profile-bar">
    <label for="userProfileSelect">Active User:</label>
    <select id="userProfileSelect" onchange="handleUserChange(this.value)">
      <option value="">-- Select Profile --</option>
      <option value="Randy">Randy</option>
      <option value="Rob">Rob</option>
      <option value="Bev">Bev</option>
    </select>
  </div>

  <script src="script.js"></script>

  <!-- Floating New Tab Button -->
  <button class="new-tab-floater" title="Open Home in New Tab" onclick="window.open('https://www.brlavin.com/index.html', '_blank')">
    <svg viewBox="0 0 24 24">
      <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
    </svg>
  </button>
</body>
</html>
